<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linguistics Exercise: Neo-Gricean & Relevance Theories</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.10/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #e0f7fa, #80deea);
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 600px;
      margin: 2rem auto;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .btn-primary {
      background-color: #0288d1;
      color: white;
    }
    .btn-secondary {
      background-color: #4caf50;
      color: white;
    }
    .btn-restart {
      background-color: #f44336;
      color: white;
    }
    .btn-submit {
      background-color: #ffb300;
      color: white;
    }
    h1, h2, h3 {
      color: #01579b;
    }
    p {
      color: #333;
    }
    textarea {
      border: 2px solid #0288d1;
      border-radius: 8px;
      padding: 0.5rem;
      width: 100%;
      resize: vertical;
      transition: border-color 0.3s ease;
    }
    textarea:focus {
      border-color: #4caf50;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const questions = [
      {
        id: 1,
        text: "Consider the statement: 'John has two cats.' According to Neo-Gricean Theory, what is the Q-implicature generated by this statement, and why does it arise?",
        answer: "The Q-implicature is that John does not have more than two cats.",
        explanation: "The Q-Principle requires the speaker to make the strongest statement consistent with their knowledge. By saying 'two' instead of a higher number, the speaker implies they lack evidence that John has more cats, per the Q-heuristic ('what isn’t said, isn’t'), leading the hearer to infer that John has exactly two cats."
      },
      {
        id: 2,
        text: "Consider the statement: 'The movie was fine.' What is the I-implicature generated by this statement, and how does the I-Principle contribute to it?",
        answer: "The I-implicature is that the movie was neither great nor terrible, but average.",
        explanation: "The I-Principle encourages the hearer to infer the most stereotypical interpretation based on minimal information. By using the neutral term 'fine' instead of a stronger term like 'amazing,' the speaker implies a moderate evaluation, leading to the implicature that the movie was satisfactory but not exceptional."
      },
      {
        id: 3,
        text: "Contrast the statements 'I’m meeting my friend' and 'I’m meeting a friend.' How does the M-Principle explain the difference in implicatures?",
        answer: "- 'I’m meeting my friend' implicates that the speaker is meeting a specific, known friend.<br>- 'I’m meeting a friend' implicates that the speaker is meeting someone who may not be a close or specific friend, possibly a casual acquaintance.",
        explanation: "The M-Principle states that marked expressions signal non-standard meanings. The unmarked 'my friend' suggests a default, specific relationship, while the marked 'a friend' (with the indefinite article) implies a less specific or less familiar connection."
      },
      {
        id: 4,
        text: "In Relevance Theory, why is human communication described as an 'ostensive-inferential' process?",
        answer: "Human communication is ostensive-inferential because the speaker provides overt cues to signal their communicative intent, and the listener infers the intended meaning using these cues and context.",
        explanation: "Relevance Theory views communication as a process where speakers make their intentions clear through deliberate signals (ostensive acts), and listeners interpret these signals by seeking the most relevant meaning, balancing cognitive effects and processing effort."
      },
      {
        id: 5,
        text: "How might the Q-Principle be applied to improve an AI’s response to a user’s question, such as 'Are there any restaurants nearby?'",
        answer: "The Q-Principle could ensure the AI provides a detailed, informative response, such as 'Yes, there are three Italian restaurants within a 5-minute walk,' rather than a vague 'Yes.'",
        explanation: "The Q-Principle requires the speaker to provide the strongest statement consistent with their knowledge. By applying this, an AI can deliver precise, contextually relevant answers that meet the user’s informational needs, improving clarity and usefulness."
      }
    ];

    const App = () => {
      const [currentQuestion, setCurrentQuestion] = React.useState(0);
      const [showSummary, setShowSummary] = React.useState(false);
      const [userAnswers, setUserAnswers] = React.useState(Array(questions.length).fill(''));
      const [showAnswer, setShowAnswer] = React.useState(false);

      const handleNext = () => {
        if (currentQuestion < questions.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
          setShowAnswer(false);
        } else {
          setShowSummary(true);
        }
      };

      const handlePrevious = () => {
        if (currentQuestion > 0) {
          setCurrentQuestion(currentQuestion - 1);
          setShowAnswer(false);
        }
      };

      const handleRestart = () => {
        setCurrentQuestion(0);
        setShowSummary(false);
        setUserAnswers(Array(questions.length).fill(''));
        setShowAnswer(false);
      };

      const handleAnswerChange = (e) => {
        const newAnswers = [...userAnswers];
        newAnswers[currentQuestion] = e.target.value;
        setUserAnswers(newAnswers);
      };

      const handleSubmit = () => {
        setShowAnswer(true);
      };

      return (
        <div className="container mx-auto p-4">
          {showSummary ? (
            <div className="card">
              <h1 className="text-3xl font-bold mb-6 text-center">Summary of Answers</h1>
              {questions.map((q, index) => (
                <div key={q.id} className="mb-6">
                  <h2 className="text-xl font-semibold mb-2">Question {index + 1}</h2>
                  <p className="mb-2"><strong>Question:</strong> {q.text}</p>
                  <p className="mb-2"><strong>Your Answer:</strong> {userAnswers[index] || 'No answer provided'}</p>
                  <p className="mb-2"><strong>Correct Answer:</strong> <span dangerouslySetInnerHTML={{ __html: q.answer }} /></p>
                  <p><strong>Explanation:</strong> {q.explanation}</p>
                </div>
              ))}
              <div className="flex justify-center mt-6">
                <button
                  onClick={handleRestart}
                  className="btn btn-restart"
                >
                  Restart Exercise
                </button>
              </div>
            </div>
          ) : (
            <div className="card">
              <h1 className="text-3xl font-bold mb-4 text-center">Linguistics Exercise</h1>
              <h2 className="text-xl font-semibold mb-4">Question {currentQuestion + 1}</h2>
              <p className="mb-4">{questions[currentQuestion].text}</p>
              <textarea
                value={userAnswers[currentQuestion]}
                onChange={handleAnswerChange}
                placeholder="Type your answer here..."
                className="mb-4"
                rows="4"
              />
              <div className="flex justify-center mb-4">
                <button
                  onClick={handleSubmit}
                  className="btn btn-submit"
                >
                  Submit Answer
                </button>
              </div>
              {showAnswer && (
                <div className="mb-4 p-4 bg-blue-100 rounded-lg">
                  <p><strong>Correct Answer:</strong> <span dangerouslySetInnerHTML={{ __html: questions[currentQuestion].answer }} /></p>
                  <p><strong>Explanation:</strong> {questions[currentQuestion].explanation}</p>
                </div>
              )}
              <div className="flex justify-between">
                <button
                  onClick={handlePrevious}
                  className="btn btn-primary"
                  disabled={currentQuestion === 0}
                >
                  Previous
                </button>
                <button
                  onClick={handleNext}
                  className="btn btn-secondary"
                >
                  {currentQuestion === questions.length - 1 ? 'See Summary' : 'Next'}
                </button>
              </div>
              <div className="flex justify-center mt-4">
                <button
                  onClick={handleRestart}
                  className="btn btn-restart"
                >
                  Restart
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
